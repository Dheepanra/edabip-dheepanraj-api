spring.datasource.url=jdbc:h2:mem:edabip;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# test-only values, not a real secret
jwt.secret=test-secret-key-for-unit-tests-only-1234567890
jwt.expiration-ms=600000
app.seed.password=Password@123
app.cors.allowed-origins=http://localhost:5173
logging.level.com.edabip=INFO
