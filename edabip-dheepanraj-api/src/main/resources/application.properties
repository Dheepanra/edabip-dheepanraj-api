spring.application.name=edabip-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database (credentials come from environment variables, never committed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edabip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by schema.sql; Hibernate only validates it
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (secret must be at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS: comma separated list, React dev server by default
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Password given to the seeded users on first start
app.seed.password=${SEED_USER_PASSWORD:Password@123}

springdoc.swagger-ui.path=/swagger-ui.html
