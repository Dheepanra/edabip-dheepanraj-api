# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Create the DB and run schema.sql + data.sql manually first (see README).
spring.datasource.url=jdbc:mysql://localhost:3306/edabip?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.h2.console.enabled=false
spring.sql.init.mode=never
